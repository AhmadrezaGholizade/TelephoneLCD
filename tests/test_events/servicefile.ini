[Unit]
Description=Phone Button and Handset Monitor
After=network.target

[Service]
Type=simple
ExecStart=/usr/bin/python3 /root/UI_LCD/test_events/phone_monitor_service.py --silent
WorkingDirectory=/root/UI_LCD
Restart=always
RestartSec=3
User=root
Group=root
StandardOutput=null
StandardError=null

[Install]
WantedBy=multi-user.target